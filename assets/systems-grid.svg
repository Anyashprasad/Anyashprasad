<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" fill="none">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .num { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    .title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { font-size: 11.5px; }
    .metric { font-size: 10.5px; letter-spacing: 0.04em; }
    .pulse { animation: p 2.4s ease-in-out infinite; }
    .card { animation: up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="859" height="219" rx="14" fill="#090B0E" stroke="#242A31"/>
  
  <g class="card" style="animation-delay:0.1s">
    <rect x="12" y="12" width="412" height="92" rx="12" fill="#101419" stroke="#242A31"/>
    <text x="30" y="36" class="mono num" fill="#8CDFFF">[01]</text>
    <text x="64" y="36" class="sans title" fill="#F1EFE8">RES-DARE</text>
    <circle cx="404" cy="32" r="3.5" fill="#8CDFFF" class="pulse"/>
    <text x="30" y="57" class="sans sub" fill="#8B929A">Adaptive MoE IDS · VECC (DAE)</text>
    <text x="30" y="77" class="mono metric" fill="#D6DCE2">0.999 AUROC  ·  0.792 @ 10% corruption</text>
    <rect x="30" y="88" width="376" height="4" rx="2" fill="#1A2028"/>
    <rect x="30" y="88" width="345" height="4" rx="2" fill="#8CDFFF" class="bar" style="animation-delay:0.1s"/>
  </g>
  <g class="card" style="animation-delay:0.25s">
    <rect x="436" y="12" width="412" height="92" rx="12" fill="#101419" stroke="#242A31"/>
    <text x="454" y="36" class="mono num" fill="#FF6B5B">[02]</text>
    <text x="488" y="36" class="sans title" fill="#F1EFE8">Wikiscan</text>
    <circle cx="828" cy="32" r="3.5" fill="#FF6B5B" class="pulse"/>
    <text x="454" y="57" class="sans sub" fill="#8B929A">Live Web Vulnerability Scanner</text>
    <text x="454" y="77" class="mono metric" fill="#D6DCE2">SQLi / XSS / CSRF  ·  WebSockets</text>
    <rect x="454" y="88" width="376" height="4" rx="2" fill="#1A2028"/>
    <rect x="454" y="88" width="323" height="4" rx="2" fill="#FF6B5B" class="bar" style="animation-delay:0.25s"/>
  </g>
  <g class="card" style="animation-delay:0.4s">
    <rect x="12" y="116" width="412" height="92" rx="12" fill="#101419" stroke="#242A31"/>
    <text x="30" y="140" class="mono num" fill="#8CDFFF">[03]</text>
    <text x="64" y="140" class="sans title" fill="#F1EFE8">ACE Edge</text>
    <circle cx="404" cy="136" r="3.5" fill="#8CDFFF" class="pulse"/>
    <text x="30" y="161" class="sans sub" fill="#8B929A">Compact Deepfake Detector</text>
    <text x="30" y="181" class="mono metric" fill="#D6DCE2">0.994 AUROC  ·  1.84x Dual-T4 Speedup</text>
    <rect x="30" y="192" width="376" height="4" rx="2" fill="#1A2028"/>
    <rect x="30" y="192" width="334" height="4" rx="2" fill="#8CDFFF" class="bar" style="animation-delay:0.4s"/>
  </g>
  <g class="card" style="animation-delay:0.55s">
    <rect x="436" y="116" width="412" height="92" rx="12" fill="#101419" stroke="#242A31"/>
    <text x="454" y="140" class="mono num" fill="#FF6B5B">[04]</text>
    <text x="488" y="140" class="sans title" fill="#F1EFE8">AgentTrap</text>
    <circle cx="828" cy="136" r="3.5" fill="#FF6B5B" class="pulse"/>
    <text x="454" y="161" class="sans sub" fill="#8B929A">Adversarial LLM Agent Benchmark</text>
    <text x="454" y="181" class="mono metric" fill="#D6DCE2">20 Attack Contexts  ·  Trajectory Logs</text>
    <rect x="454" y="192" width="376" height="4" rx="2" fill="#1A2028"/>
    <rect x="454" y="192" width="312" height="4" rx="2" fill="#FF6B5B" class="bar" style="animation-delay:0.55s"/>
  </g>
</svg>